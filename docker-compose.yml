services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: code-to-spec-pgvector
    environment:
      POSTGRES_USER: cts
      POSTGRES_PASSWORD: cts
      POSTGRES_DB: cts
    ports:
      - "5433:5432"          # 5433 on host to avoid clashing with a local Postgres
    volumes:
      - cts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cts -d cts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cts_pgdata:
