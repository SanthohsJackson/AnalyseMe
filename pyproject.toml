[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "analyse-me"
version = "0.1.0"
description = "Analyse Me — ingest a codebase and produce a language-agnostic reimplementation spec"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "tree-sitter==0.21.3",
    "tree-sitter-languages==1.10.2",
    "pydantic>=2.0",
    "click>=8.0",
    "typer>=0.12",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.scripts]
analyse-me = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
